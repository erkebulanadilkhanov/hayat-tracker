<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0e1a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hayat">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hayat tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Literata:wght@600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a24;--p:#15283a;--t:#e8f0f4;--m:#8fa5b3;--l:#223a4e;--g:#4fb3a5;--on:#06201c;--a1:#4fb3a5;--a2:#f2d98d;--a3:#9aa5f2}
@media(prefers-color-scheme:light){:root{--bg:#eef3f5;--p:#fff;--t:#14222d;--m:#5f7584;--l:#d6e2e9;--g:#1f7f73;--on:#fff;--a1:#1f9a8b;--a2:#c8941a;--a3:#6572d9}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Onest,system-ui,sans-serif;color:var(--t);background:radial-gradient(600px 320px at 50% 0,rgba(79,179,165,.16),transparent) no-repeat,var(--bg);}
html,body{height:100%;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.top{flex:none;height:env(safe-area-inset-top);background:var(--bg)}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
header small{color:var(--m);text-transform:capitalize}
header b{display:block;font:600 28px/1.2 Literata,Georgia,serif;margin-top:2px}
.hero{display:flex;align-items:center;gap:18px;margin:18px 0 22px}.hero svg{flex:none}
.tr,.ar{fill:none;stroke-width:14;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px}.tr{stroke:var(--l)}
.ar{animation:f 1.1s ease-out}@keyframes f{from{stroke-dashoffset:var(--c)}}
@media(prefers-reduced-motion:reduce){.ar{animation:none}}
.big{font:600 34px Literata,Georgia,serif;fill:var(--t)}.cap{font-size:13px;fill:var(--m)}
.lg{flex:1;display:grid;gap:10px}.lg div{display:flex;align-items:center;gap:8px}.lg b{margin-left:auto}.lg i{width:10px;height:10px;border-radius:50%}
.panel{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:18px;margin:14px 0}
h2{margin:0 0 10px;font:600 19px Literata,Georgia,serif}
.m{color:var(--m);font-size:14px}p{margin:8px 0}
input,select,textarea,button{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--l);background:var(--bg);color:var(--t);width:100%;margin-top:6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button{background:var(--g);color:var(--on);border:0;font-weight:600;margin-top:12px}
.row{display:flex;gap:8px}.row button{margin:6px 0 0;padding:12px 0;background:var(--l);color:var(--t)}.row .on{background:var(--g);color:var(--on)}
.streak{display:flex;align-items:baseline;gap:10px}.streak b{font:600 34px Literata,Georgia,serif;color:var(--a2)}
nav{flex:none;display:flex;gap:4px;width:min(92%,440px);margin:6px auto calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:22px;background:var(--p);border:1px solid var(--l)}
nav button{margin:0;padding:8px 0;font-size:12px;font-weight:500;background:none;color:var(--m);border-radius:16px}nav span{display:block;font-size:18px}nav .on{background:var(--l);color:var(--t)}
input{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:48px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.scroll>*{max-width:520px;margin-left:auto;margin-right:auto}
.gl{flex:1;display:grid;gap:6px;font-size:14px}.gl div{display:flex;gap:6px;color:var(--m)}.gl b{margin-left:auto;font-weight:600;color:var(--t)}.gl .ok,.gl .ok b{color:var(--a1)}
</style></head><body><main id="app"></main>
<script>
// ВСТАВЬ ссылку веб-приложения (оканчивается на /exec) и свои имена (как в Code.gs)
const API='https://script.google.com/macros/s/AKfycbzwdyrcs-bAg51369RxlA9SrdVcvWDbBmR9bhWu0QYxZ8jfuqKDnCZiLnGpInXL-dswbg/exec', NAMES=['yerkebulan','hayat'];
// Дневные минимумы у каждого свои. b = да/нет, w = недельная цель (g раз в неделю)
const GOALS={
 yerkebulan:[{k:'quran',n:'Құран',u:'стр.',g:3},{k:'risale',n:'Рисале',u:'стр.',g:3},{k:'pyrlanta',n:'Пырланты',u:'стр.',g:6},{k:'dinleme',n:'Динлеме',u:'мин.',g:6},{k:'tasbihat',n:'Тасбихат',b:1,g:1},{k:'tahajjud',n:'Тахаджуд',b:1,w:1,g:2},{k:'oraza',n:'Ораза',b:1,w:1,g:1}],
 hayat:[{k:'quran',n:'Құран',u:'стр.',g:5},{k:'risale',n:'Рисале',u:'стр.',g:4},{k:'kitap',n:'Кітап',u:'стр.',g:10},{k:'dinleme',n:'Динлеме',u:'мин.',g:10},{k:'tasbihat',n:'Тасбихат',b:1,g:1},{k:'qaza',n:'Қаза намаз',u:'раз',g:5},{k:'tahajjud',n:'Тахаджуд',b:1,w:1,g:3},{k:'kazhet',n:'Кажет намаз',b:1,w:1,g:2}]
};
let dr={};
let me=null,pin='',data=null,tab='t',day='',nz=0,msg='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
async function call(a,p={}){
  const r=await fetch(API+'?'+new URLSearchParams({a,u:me,pin,...p}));
  const j=await r.json();if(j.error)throw new Error(j.error);data=j;if(!day)day=j.today;return j}
const add=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const ws=s=>add(s,-((new Date(s+'T12:00:00Z').getUTCDay()+6)%7)), fm=s=>s.slice(8)+'.'+s.slice(5,7);
const ent=(u,d)=>data.days.find(x=>x.user===u&&x.day===d);
const val=(u,d,k)=>{const e=ent(u,d);return(e&&e.v&&+e.v[k])||0};
const dg=u=>GOALS[u].filter(x=>!x.w);
const full=(u,d)=>!!ent(u,d)&&dg(u).every(x=>val(u,d,x.k)>=x.g);
const wk=(u,d,k)=>[0,1,2,3,4,5,6].reduce((a,i)=>a+val(u,add(ws(d),i),k),0);
function streak(u,d){if(!full(u,d)&&d===data.today)d=add(d,-1);let n=0;while(full(u,d)){n++;d=add(d,-1)}return n}
function pairStreak(d){const ok=x=>NAMES.every(u=>full(u,x));if(!ok(d)&&d===data.today)d=add(d,-1);let n=0;while(ok(d)){n++;d=add(d,-1)}return n}
const cell=(u,d,x)=>x.b?`${x.n}: ${val(u,d,x.k)?'да':'нет'}`:`${x.n} ${val(u,d,x.k)}/${x.g}`;
function dayHtml(d){let h='',both=0;
  NAMES.forEach(u=>{if(!ent(u,d)){h+=`<p><b>${esc(u)}</b>: ещё не отметился(лась)</p>`;return}
    const ds=dg(u),ok=ds.filter(x=>val(u,d,x.k)>=x.g).length;if(ok==ds.length)both++;
    h+=`<p><b>${esc(u)}</b>${ok==ds.length?' ✅':''} <span class=m>${ok}/${ds.length} · серия ${streak(u,d)} дн.</span><br><span class=m>${GOALS[u].map(x=>cell(u,d,x)).join(' · ')}</span></p>`});
  return h+(both==NAMES.length?`<p>🌙 Оба выполнили дневные цели! Общая серия: ${pairStreak(d)} дн.</p>`:'')}
function weekHtml(m){const days=[0,1,2,3,4,5,6].map(i=>add(m,i));let h='';
  NAMES.forEach(u=>{const f=days.filter(d=>full(u,d)).length;
    h+=`<p><b>${esc(u)}</b><br>Дней со всеми дневными целями: ${f}/7<br><span class=m>${GOALS[u].map(x=>x.w?`${x.n}: ${wk(u,m,x.k)} из ${x.g} ${wk(u,m,x.k)>=x.g?'✅':''}`:`${x.n}: ${days.filter(d=>val(u,d,x.k)>=x.g).length}/7 дн.`).join('<br>')}</span></p>`});
  return h+`<p>Оба выполнили дневные цели: ${days.filter(d=>NAMES.every(u=>full(u,d))).length}/7 дн.</p>`}
function rings(){const u=me,ds=dg(u),ok=ds.filter(x=>val(u,day,x.k)>=x.g).length,p=ok/ds.length,r=80,L=+(2*Math.PI*r).toFixed(1);
  const gl=GOALS[u].map(x=>{const v=val(u,day,x.k),w=x.w?wk(u,day,x.k):v,done=x.w?w>=x.g:v>=x.g;
    return `<div class="${done?'ok':''}">${done?'✓ ':''}${x.n}<b>${x.w?w+'/'+x.g+' нед.':x.b?(v?'да':'нет'):v+'/'+x.g}</b></div>`}).join('');
  return `<section class=hero><svg viewBox="0 0 200 200" width=150 height=150 role=img aria-label="Прогресс дня"><circle cx=100 cy=100 r=${r} class=tr /><circle cx=100 cy=100 r=${r} stroke="var(--a1)" class=ar style="--c:${L};stroke-dasharray:${L};stroke-dashoffset:${(L*(1-p)).toFixed(1)}"/><text x=100 y=104 text-anchor=middle class=big>${ok}/${ds.length}</text><text x=100 y=128 text-anchor=middle class=cap>дневных целей</text></svg><div class=gl>${gl}</div></section>`}
function hdr(){const d=new Date((day||data.today)+'T12:00:00Z').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});return `<header><small>${d}</small><b>Салам, ${esc(me)}</b></header>`}
function viewToday(){dr={...((ent(me,day)||{}).v||{})};
  const f=GOALS[me].map(x=>x.b?`<p class=m>${x.n}${x.w?` (минимум ${x.g} в неделю)`:' (1 раз в день)'}</p><div class=row>${[0,1].map(v=>`<button data-k=${x.k} data-v=${v} class="${(+dr[x.k]||0)===v?'on':''}" onclick="setv('${x.k}',${v})">${v?'Да':'Нет'}</button>`).join('')}</div>`:`<p class=m>${x.n}, ${x.u} (минимум ${x.g})</p><input id=g_${x.k} type=number inputmode=numeric min=0 value="${dr[x.k]||''}">`).join('');
  return rings()+`<div class=panel><h2>Отметка</h2><input type=date id=dt value="${day}" onchange="day=this.value;draw()">${f}<button onclick="save()">Сохранить</button><p class=m>${msg}</p></div><div class="panel streak"><b>${streak(me,data.today)}</b><span>дн. подряд с дневными целями</span></div>`}
function setv(k,v){dr[k]=v;document.querySelectorAll(`[data-k="${k}"]`).forEach(b=>b.className=+b.dataset.v===v?'on':'')}
async function save(){msg='';const v={...dr};GOALS[me].filter(x=>!x.b).forEach(x=>{v[x.k]=+$('#g_'+x.k).value||0});
  try{await call('save',{day,data:JSON.stringify(v)});msg='✅ Сохранено'}catch(e){msg='Ошибка: '+e.message}draw()}
function viewStats(){
  return `<div class=panel><h2>Итоги дня</h2><input type=date value="${day}" onchange="day=this.value;draw()">${dayHtml(day)}</div>
  <div class=panel><h2>Неделя ${fm(ws(day))} – ${fm(add(ws(day),6))}</h2>${weekHtml(ws(day))}</div>`}

function viewBooks(){
  const cur=data.books.find(b=>b.user===me&&!b.end);let h='<div class=panel><h2>Текущая книга</h2>';
  if(cur){const n=Math.round((new Date(data.today)-new Date(cur.start))/864e5)+1;
    h+=`<p><b>${esc(cur.title)}</b><br><span class=m>с ${fm(cur.start)} · ${n} дн.</span></p><p class=m>Закончил(а)? Оценка:</p>
    <select id=rt>${[5,4,3,2,1].map(i=>`<option>${i}</option>`).join('')}</select><textarea id=rv rows=3 placeholder="Твой отзыв"></textarea>
    <button onclick="fin()">Закончить книгу</button>`}
  else h+=`<input id=bt placeholder="Название книги"><button onclick="bs()">Начать читать</button>`;
  h+='</div><div class=panel><h2>Прочитано</h2>';
  const done=data.books.filter(b=>b.end).reverse();
  h+=done.length?done.map(b=>`<p><b>${esc(b.title)}</b> · ${esc(b.user)}<br>${b.days} дн. · ${'⭐'.repeat(b.rating)}<br><span class=m>${esc(b.review)}</span></p>`).join(''):'<p class=m>Пока пусто</p>';
  return h+'</div>'}
async function bs(){const t=$('#bt').value.trim();if(!t)return;await run(()=>call('bookStart',{title:t}))}
async function fin(){await run(()=>call('bookFinish',{rating:$('#rt').value,review:$('#rv').value}))}
async function run(f){try{await f()}catch(e){alert(e.message)}draw()}

function draw(){
  const a=$('#app');
  if(!me){a.innerHTML=`<div class=top></div><div class=scroll><div class=panel><h2>Кто ты?</h2><select id=nm>${NAMES.map(n=>`<option>${esc(n)}</option>`).join('')}</select><button onclick="login()">Войти</button><p class=m id=er></p></div></div>`;return}
  if(!data){a.innerHTML='<div class=top></div><div class=scroll><p class=m>Загрузка…</p></div>';return}
  const v={t:viewToday,s:viewStats,b:viewBooks}[tab]();
  a.innerHTML='<div class=top></div><div class=scroll>'+hdr()+v+'</div>'+`<nav>${[['t','🌙','Сегодня'],['s','📊','Итоги'],['b','📖','Книги']].map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';msg='';draw()"><span>${i}</span>${n}</button>`).join('')}</nav>`}
async function login(){me=$('#nm').value;pin='';
  try{await call('get');ls('me',me);ls('pin',pin);draw()}catch(e){me=null;draw();$('#er').textContent=e.message}}
me=ls('me');pin=ls('pin')||'';
if(me){draw();call('get').then(draw).catch(()=>{me=null;draw()})}else draw();
</script></body></html>
